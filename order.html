<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order — Maison Sarah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container header-bar">
        <h1 class="brand">Maison Sarah</h1>
        <nav>
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="order.html">Order</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <h2>Order</h2>
        <p>
          Fill in the form below to reserve your bread and pastries ahead of
          time.
        </p>

        <form action="https://example.com/preorder" method="get">
          <fieldset>
            <legend>Who is picking up</legend>

            <label for="name">Name</label>
            <input
              class="field"
              type="text"
              id="name"
              name="name"
              placeholder="Your full name"
              required
            />

            <label for="email">Email</label>
            <input
              class="field"
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Pickup day</legend>

            <div class="choice">
              <input
                type="radio"
                id="day-friday"
                name="pickup-day"
                value="Friday"
              />
              <label for="day-friday">Friday</label>
            </div>
            <div class="choice">
              <input
                type="radio"
                id="day-saturday"
                name="pickup-day"
                value="Saturday"
                checked
              />
              <label for="day-saturday">Saturday</label>
            </div>
            <div class="choice">
              <input
                type="radio"
                id="day-sunday"
                name="pickup-day"
                value="Sunday"
              />
              <label for="day-sunday">Sunday</label>
            </div>

            <label for="pickup-time">Pickup time</label>
            <select class="field" id="pickup-time" name="pickup-time">
              <option value="8:00">8:00</option>
              <option value="10:00">10:00</option>
              <option value="12:00">12:00</option>
              <option value="14:00">14:00</option>
              <option value="16:00">16:00</option>
            </select>
          </fieldset>

          <fieldset>
            <legend>Your order</legend>

            <div class="choice">
              <input
                type="checkbox"
                id="item-sourdough"
                name="items"
                value="Sourdough loaf"
              />
              <label for="item-sourdough">Sourdough loaf</label>
            </div>
            <div class="choice">
              <input
                type="checkbox"
                id="item-baguette"
                name="items"
                value="Baguette"
              />
              <label for="item-baguette">Baguette</label>
            </div>
            <div class="choice">
              <input
                type="checkbox"
                id="item-croissant"
                name="items"
                value="Croissant"
              />
              <label for="item-croissant">Croissant</label>
            </div>
            <div class="choice">
              <input
                type="checkbox"
                id="item-pain-au-chocolat"
                name="items"
                value="Pain au chocolat"
              />
              <label for="item-pain-au-chocolat">Pain au chocolat</label>
            </div>
            <div class="choice">
              <input
                type="checkbox"
                id="item-lemon-tart"
                name="items"
                value="Lemon tart"
              />
              <label for="item-lemon-tart">Lemon tart</label>
            </div>

            <label for="notes">Notes</label>
            <textarea
              class="field"
              id="notes"
              name="notes"
              placeholder="Anything else we should know?"
            ></textarea>
          </fieldset>

          <button type="submit">Submit pre-order</button>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Maison Sarah</p>
    </footer>
  </body>
</html>
